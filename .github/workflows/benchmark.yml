name: Benchmark

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # A repo with no audit role yet (like the template repo) runs this job instead
  # of the benchmark, and it says what to set up. Once AWS_AUDIT_ROLE_ARN is set, it skips.
  benchmark-not-set-up:
    name: "Benchmark skipped: set up AWS first"
    if: vars.AWS_AUDIT_ROLE_ARN == ''
    runs-on: ubuntu-latest
    steps:
      - name: Say what to set up
        run: |
          echo "::notice title=Benchmark skipped: set up AWS first::Set the AWS_AUDIT_ROLE_ARN variable to run the CIS benchmark. The run summary lists the steps."
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Benchmark skipped: this repo has no audit role yet

          The weekly Prowler CIS benchmark signs in to AWS as a read-only `security-audit` role:

          1. Create the `security-audit` role with `reference/security-audit-trust.json` (Security section, Unit 1).
          2. **Settings → Secrets and variables → Actions → Variables:** add `AWS_AUDIT_ROLE_ARN`, set to that role's ARN.

          Then run it from **Actions → Benchmark → Run workflow**, or wait for Monday's run.
          EOF

  prowler:
    if: vars.AWS_AUDIT_ROLE_ARN != ''
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full commit SHA, not a version tag. Unit 3 explains why.
      - name: Sign in to AWS as security-audit (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_AUDIT_ROLE_ARN }}
          aws-region: eu-west-2

      - name: CIS AWS Foundations with Prowler (reports only)
        run: |
          mkdir -p reports && chmod 777 reports
          docker run --rm \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
            -v "$PWD/reports:/home/prowler/output" \
            prowlercloud/prowler:5.45.0 aws \
            --compliance cis_7.0_aws --region eu-west-2 \
            -M json-ocsf html -o /home/prowler/output -z

      - name: Keep the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-reports
          path: reports/
